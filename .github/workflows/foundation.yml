name: Foundation acceptance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.5"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.11.1"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.8"
          enable-cache: false
      - run: uv sync --locked --python 3.13.5
      - run: mkdir -p .artifacts
      - run: FOUNDATION_INTEGRATION=1 .venv/bin/python -m pytest tests -q --basetemp=.artifacts/pytest
      - run: git diff --exit-code
  orchestration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.5"
      - name: Offline prototype checks (no model requests)
        working-directory: orchestration
        run: python3 -B -m unittest discover -s tests -v
      - run: git diff --exit-code
